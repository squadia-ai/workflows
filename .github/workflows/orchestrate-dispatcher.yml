name: Squadia - Orchestrate Dispatcher (reusable)

# Reusable workflow chamado pelo repo "ops" de um tenant via:
#   uses: squadia-ai/workflows/.github/workflows/orchestrate-dispatcher.yml@v0
#   secrets: inherit
#
# Este e um PRE-CHECK BARATO: roda a cada tick do cron do tenant, sem
# container, sem docker e sem LLM. So decide se vale a pena acordar o
# worker do orquestrador (via workflow_dispatch), olhando quais workflows
# de papel ja estao rodando/enfileirados no repo caller.
#
# IMPORTANTE (otimizacao de custo, nao fonte de verdade): esta checagem e
# apenas uma heuristica para evitar acordar o worker (e a imagem/LLM) sem
# necessidade. O worker SEMPRE revalida ocupacao, rate-limit e pausa por
# conta propria antes de agir — defesa em profundidade, ja que o estado
# pode mudar entre este pre-check e a execucao do worker.
#
# workflow_dispatch criado aqui com o GITHUB_TOKEN dispara o workflow alvo
# no proprio repo caller: isto e uma excecao documentada a regra geral de
# anti-recursao de workflows (o GITHUB_TOKEN normalmente nao encadeia
# outros workflows, exceto workflow_dispatch e repository_dispatch).

on:
  workflow_call:
    inputs:
      worker_workflow:
        description: "Nome do arquivo do stub do worker no repo ops (quem sera acordado)"
        type: string
        default: "orchestrate.yml"
      agent_workflows:
        description: "CSV de pares papel:arquivo-do-stub no repo ops (papeis validos: refine, dev, review, qa_scenarios, qa)"
        type: string
        default: "refine:refine-agent.yml,dev:dev-agent.yml,review:review-agent.yml"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: squadia-dispatcher
      cancel-in-progress: false
    permissions:
      actions: write
    steps:
      - name: Verifica ocupacao e decide se acorda o worker
        uses: actions/github-script@v7
        env:
          WORKER_WORKFLOW: ${{ inputs.worker_workflow }}
          AGENT_WORKFLOWS: ${{ inputs.agent_workflows }}
        with:
          script: |
            const workerWorkflow = process.env.WORKER_WORKFLOW;
            // Pares papel:arquivo — o busy-check olha ARQUIVOS de stub, mas o
            // worker (e o core) falam em PAPEIS (refine|dev|review|qa_scenarios|qa).
            const validRoles = new Set(["refine", "dev", "review", "qa_scenarios", "qa"]);
            const agentWorkflows = (process.env.AGENT_WORKFLOWS || "")
              .split(",")
              .map((s) => s.trim())
              .filter(Boolean)
              .map((pair) => {
                const [role, file] = pair.split(":").map((s) => s.trim());
                if (!validRoles.has(role) || !file) {
                  throw new Error(
                    `agent_workflows invalido: "${pair}" (esperado papel:arquivo, papeis: refine|dev|review|qa_scenarios|qa)`
                  );
                }
                return { role, file };
              });

            // Monta o set de basenames de workflow ocupados (rodando ou
            // enfileirados) no repo caller.
            const busy = new Set();
            for (const status of ["in_progress", "queued"]) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  status,
                }
              );
              for (const run of runs) {
                busy.add(run.path.split("/").pop());
              }
            }

            if (busy.has(workerWorkflow)) {
              console.log(
                `Worker (${workerWorkflow}) ja esta ocupado; nada a fazer neste tick.`
              );
              return;
            }

            const free = agentWorkflows
              .filter(({ file }) => !busy.has(file))
              .map(({ role }) => role);

            if (free.length === 0) {
              console.log(
                "Nenhum papel livre no momento; nao ha o que acordar neste tick."
              );
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workerWorkflow,
              ref: "develop",
              inputs: { free: free.join(",") },
            });

            console.log(
              `Worker (${workerWorkflow}) acordado com papeis livres: ${free.join(",")}`
            );
