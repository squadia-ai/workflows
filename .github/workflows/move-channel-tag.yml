# Move as tags git moveis de canal (SQD-273/dev-prod split): cada push em
# develop, release ou main reaponta a tag correspondente pro commit recem-chegado,
# pra quem consome `uses: squadia-ai/workflows/.../X.yml@dev` (ou @prod)
# sempre pegar o ultimo commit daquele canal sem intervencao manual — isso
# elimina a classe de impedimento "mover tag e acao sensivel fora do
# alcance do dev" que apareceu na pratica (SQD-283/284).

name: Move channel tag

on:
  push:
    branches: [develop, release, main]

permissions:
  contents: write

jobs:
  move-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nenhum `${{ }}` dentro do `run:` (regra de segurança deste repo): o
      # nome do branch entra por `env:` e é lido do ambiente.
      - name: Determina a tag do canal a partir do branch
        id: channel
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            main)    echo "tag=prod" >> "$GITHUB_OUTPUT" ;;
            release) echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
            *)       echo "tag=dev"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Reaponta a tag do canal
        env:
          CHANNEL_TAG: ${{ steps.channel.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${CHANNEL_TAG}"
          git push origin "${CHANNEL_TAG}" --force

  # A publicação do PRÓPRIO `workflows` é o reapontamento da tag do canal: é a
  # tag (@dev/@beta/@prod) que os stubs do ops consomem, então o instante em
  # que ela passa a apontar pro commit novo é o instante em que ele está no ar
  # — não o merge. Por isso o callback (SQD-437) vem depois de `move-tag`, e
  # não junto dele.
  #
  # Só roda onde a Variable `SQUADIA_PLATFORM_URL` existe, mesma convenção
  # opcional de `AWS_DATAPLANE_ROLE_ARN` nos workflows de papel: repositório
  # sem ela não muda de comportamento nenhum.
  reportar-publicacao:
    needs: move-tag
    if: vars.SQUADIA_PLATFORM_URL != ''
    uses: ./.github/workflows/publish-callback.yml
    with:
      platform_url: ${{ vars.SQUADIA_PLATFORM_URL }}
      channel: ${{ github.ref_name }}
    secrets: inherit
